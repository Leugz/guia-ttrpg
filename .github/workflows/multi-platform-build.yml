name: Build Multi-Platform Installers
on:
  workflow_dispatch:
  push:
    paths:
      - 'src-tauri/tauri.conf.json'

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        # This tells GitHub to run this entire job twice: once on Windows, once on Linux
        platform: [windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      
      # --- NEW: Install Linux-specific dependencies (Only runs on the Ubuntu machine) ---
      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install dependencies
        run: pnpm install
        
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: 'build-${{ github.run_number }}'
          releaseName: 'A Maldicao do Idolo de Pedra (Build ${{ github.run_number }})'
          releaseBody: 'Automated cross-platform builds.'
          releaseDraft: true
