name: Build Windows Installer
on:
  workflow_dispatch: # Allows you to trigger the build manually
  push:
    paths:
      - 'src-tauri/tauri.conf.json' # Only auto-runs if you update Tauri configs

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install dependencies
        run: pnpm install
        
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Automatically generates a unique tag like "build-14" to prevent conflicts
          tagName: 'build-${{ github.run_number }}'
          releaseName: 'A Maldicao do Idolo de Pedra (Build ${{ github.run_number }})'
          releaseBody: 'Automated Windows build.'
          releaseDraft: true
