[package]
name = "guia-ttrpg"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2.11.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
gray_matter = "0.2"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
rand = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }
